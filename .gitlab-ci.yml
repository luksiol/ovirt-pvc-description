stages:
  - dependencies
  - build
  - chart

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"

  GOPATH: "$CI_PROJECT_DIR/.go"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"

  DOCKER_TLS_CERTDIR: "/certs"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

  CHART_DIR: "charts/ovirt-pvc-description"
  CHART_OCI_REPO: "oci://$CI_REGISTRY_IMAGE/charts"


# --------------------------------------------------
# Go dependencies
# --------------------------------------------------

go-dependencies:
  stage: dependencies
  image: golang:1.22.12

  cache:
    key:
      files:
        - go.mod
    paths:
      - .go/pkg/mod/

  script:
    - go mod tidy
    - go mod download
    - go mod verify
    - echo "Go dependencies ready"

  artifacts:
    paths:
      - go.mod
      - go.sum
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'


# --------------------------------------------------
# Docker build (tylko dla branchy - bez pusha)
# --------------------------------------------------

docker-build:
  stage: build
  image: docker:29.4.3

  services:
    - name: docker:27-dind
      alias: docker

  needs:
    - job: go-dependencies
      artifacts: true

  script:
    - docker build --pull --build-arg VERSION="$CI_COMMIT_SHORT_SHA" -t "$IMAGE_NAME:$CI_COMMIT_SHA" .

  rules:
    - if: '$CI_COMMIT_BRANCH'


# --------------------------------------------------
# Docker build and push (tylko dla tagów wersji)
# --------------------------------------------------

docker-build-push:
  stage: build
  image: docker:29.4.3

  services:
    - name: docker:27-dind
      alias: docker

  needs:
    - job: go-dependencies
      artifacts: true

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      docker build --pull --build-arg VERSION="$VERSION" -t "$IMAGE_NAME:$VERSION" .
      docker push "$IMAGE_NAME:$VERSION"

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'


# --------------------------------------------------
# Helm chart: push do OCI (Container Registry)
# --------------------------------------------------

helm-push:
  stage: chart
  image:
    name: alpine/helm:4.3.1
    entrypoint: [""]
  needs:
    - job: docker-build-push
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      sed -i "s|^version:.*|version: $VERSION|g" "$CHART_DIR/Chart.yaml"
      sed -i "s|^appVersion:.*|appVersion: \"$VERSION\"|g" "$CHART_DIR/Chart.yaml"
      sed -i "s|repository:.*|repository: $IMAGE_NAME|g" "$CHART_DIR/values.yaml"
      sed -i 's|tag:.*|tag: ""|g' "$CHART_DIR/values.yaml"
      helm lint "$CHART_DIR"
      helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination dist
      echo "$CI_REGISTRY_PASSWORD" | helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      helm push dist/*.tgz "$CHART_OCI_REPO"

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

