name: CI

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

env:
  CHART_DIR: charts/ovirt-pvc-description
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  # --------------------------------------------------
  # Go dependencies
  # --------------------------------------------------
  go-dependencies:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache: true
          cache-dependency-path: go.mod

      - name: Go deps
        run: |
          go mod tidy
          go mod download
          go mod verify
          echo "Go dependencies ready"

      - uses: actions/upload-artifact@v4
        with:
          name: go-mod-${{ github.run_id }}
          path: |
            go.mod
            go.sum
          retention-days: 1

  # --------------------------------------------------
  # Docker build (tylko branche - bez pusha)
  # --------------------------------------------------
  docker-build:
    if: github.ref_type == 'branch'
    needs: go-dependencies
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: go-mod-${{ github.run_id }}

      - name: Ustaw nazwę obrazu (lowercase)
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          pull: true
          provenance: false
          build-args: |
            VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # --------------------------------------------------
  # Docker build + push (tylko tagi wersji)
  # --------------------------------------------------
  docker-build-push:
    if: github.ref_type == 'tag'
    needs: go-dependencies
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: go-mod-${{ github.run_id }}

      - name: Ustaw nazwę obrazu i wersję
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          provenance: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Wyloguj z rejestru
        if: always()
        run: docker logout "$REGISTRY" || true

  # --------------------------------------------------
  # Helm chart: push do OCI
  # --------------------------------------------------
  helm-push:
    if: github.ref_type == 'tag'
    needs: docker-build-push
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Przygotuj chart, spakuj i wypchnij
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE_NAME="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          CHART_OCI_REPO="oci://${IMAGE_NAME}/charts"

          sed -i "s|^version:.*|version: $VERSION|g" "$CHART_DIR/Chart.yaml"
          sed -i "s|^appVersion:.*|appVersion: \"$VERSION\"|g" "$CHART_DIR/Chart.yaml"
          sed -i "s|repository:.*|repository: $IMAGE_NAME|g" "$CHART_DIR/values.yaml"
          sed -i 's|tag:.*|tag: ""|g' "$CHART_DIR/values.yaml"

          helm lint "$CHART_DIR"
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination dist

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm push dist/*.tgz "$CHART_OCI_REPO"

      - name: Wyloguj z rejestru
        if: always()
        run: helm registry logout "$REGISTRY" || true



