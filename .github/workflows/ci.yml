name: CI

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

env:
  CHART_DIR: charts/ovirt-pvc-description
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:

  docker-build:
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          pull: true
          provenance: false
          build-args: |
            VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  docker-build-push:
    if: github.ref_type == 'tag' || github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image name and version
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          provenance: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Logout from registry
        if: always()
        run: docker logout "$REGISTRY" || true

  helm-push:
    if: github.ref_type == 'tag' || github.ref_name != 'main'
    needs: docker-build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Prepare and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE_NAME="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          CHART_OCI_REPO="oci://${IMAGE_NAME}/charts"

          sed -i "s|^version:.*|version: $VERSION|g" "$CHART_DIR/Chart.yaml"
          sed -i "s|^appVersion:.*|appVersion: \"$VERSION\"|g" "$CHART_DIR/Chart.yaml"
          sed -i "s|repository:.*|repository: $IMAGE_NAME|g" "$CHART_DIR/values.yaml"
          sed -i 's|tag:.*|tag: ""|g' "$CHART_DIR/values.yaml"

          helm lint "$CHART_DIR"
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination dist

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm push dist/*.tgz "$CHART_OCI_REPO"

      - name: Logout from registry
        if: always()
        run: helm registry logout "$REGISTRY" || true


