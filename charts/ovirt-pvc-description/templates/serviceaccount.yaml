{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ovirt-pvc-description.serviceAccountName" . }}
  namespace: {{ include "ovirt-pvc-description.namespace" . }}
  labels:
    {{- include "ovirt-pvc-description.labels" . | nindent 4 }}
{{- end }}
