{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ovirt-pvc-description.name" . }}
  labels:
    {{- include "ovirt-pvc-description.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ovirt-pvc-description.name" . }}
  labels:
    {{- include "ovirt-pvc-description.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ovirt-pvc-description.serviceAccountName" . }}
    namespace: {{ include "ovirt-pvc-description.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "ovirt-pvc-description.name" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
